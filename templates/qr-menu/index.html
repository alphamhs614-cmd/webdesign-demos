<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speisekarte</title>
<meta name="description" content="Digitale Speisekarte – Deutsch & Arabisch, Bestellung per WhatsApp.">
<meta name="theme-color" content="#1f4d3a">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<!--
  QR Digital Menu – you do NOT need to edit this file.
  All content (name, logo, colours, currency, WhatsApp number, categories, dishes in both languages)
  lives in menu.json. See README.md.
-->
<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="brand"><img id="logo" src="assets/img/logo.svg" alt="" width="52" height="52"><div><h1 id="name"></h1><p id="tagline"></p></div></div>
      <button class="lang" id="lang" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langLbl"></span></button>
    </div>
    <p class="intro" id="intro"></p>
    <div class="info" id="info"></div>
  </div>
</header>
<nav class="cats" id="catsNav" aria-label="Menu"><div class="wrap" id="cats"></div></nav>
<main class="wrap">
  <div class="filters" id="filters"></div>
  <div id="menu"><p class="load">…</p></div>
  <p class="empty" id="noRes"></p>
  <footer id="foot"></footer>
</main>
<div class="bar" id="bar"><button type="button" id="barBtn"><span class="l"><span class="n" id="cn">0</span><span id="barLbl"></span></span><span class="price" style="color:#fff" id="ct"></span></button></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div id="sheetIn"></div></div>
<p class="sr" aria-live="polite" id="live"></p>
<noscript><p>Bitte JavaScript aktivieren, um die Speisekarte zu sehen. · يرجى تفعيل JavaScript لعرض القائمة.</p></noscript>
<script src="assets/js/app.js"></script>
</body>
</html>
